name: Metrics Catalog

# 手动触发：生成所有插件的预览图，放进 metrics/ 目录供挑选。
# 挑好之后，把不要的步骤删掉，改成 schedule 定时跑即可。
on:
  workflow_dispatch:

jobs:
  catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TOKEN: ${{ secrets.METRICS_TOKEN }}
      TZ: Asia/Shanghai
    steps:
      # ───────────────────────── 基础 ─────────────────────────

      - name: 01 base — 综合概览
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.TOKEN }}
          filename: metrics/01-base.svg
          config_timezone: ${{ env.TZ }}
          base: header, activity, community, repositories, metadata

      - name: 02 isocalendar — 等距 3D 提交日历
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.TOKEN }}
          filename: metrics/02-isocalendar.svg
          config_timezone: ${{ env.TZ }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: 03 calendar — 全历史提交日历
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.TOKEN }}
          filename: metrics/03-calendar.svg
          config_timezone: ${{ env.TZ }}
          base: ""
          plugin_calendar: yes

      - name: 04 languages — 语言占比
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.TOKEN }}
          filename: metrics/04-languages.svg
          config_timezone: ${{ env.TZ }}
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

      - name: 05 habits — 编码习惯（几点写代码、常用缩进）
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.TOKEN }}
          filename: metrics/05-habits.svg
          config_timezone: ${{ env.TZ }}
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      - name: 06 achievements — 成就徽章
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.TOKEN }}
          filename: metrics/06-achievements.svg
          config_timezone: ${{ env.TZ }}
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact

      - name: 07 activity — 最近动态
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.TOKEN }}
          filename: metrics/07-activity.svg
          config_timezone: ${{ env.TZ }}
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14

      # ───────────────────── 兴趣相关（你的六个方向）─────────────────────

      - name: 08 topics — 关注的话题标签（AI / Security 等）
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.TOKEN }}
          filename: metrics/08-topics.svg
          config_timezone: ${{ env.TZ }}
          base: ""
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 0

      - name: 09 starlists — star 分类清单
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.TOKEN }}
          filename: metrics/09-starlists.svg
          config_timezone: ${{ env.TZ }}
          base: ""
          plugin_starlists: yes
          plugin_starlists_limit: 2

      - name: 10 stars — 最近 star 的仓库
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.TOKEN }}
          filename: metrics/10-stars.svg
          config_timezone: ${{ env.TZ }}
          base: ""
          plugin_stars: yes
          plugin_stars_limit: 4

      - name: 11 crypto — 加密货币行情（Web3）
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.TOKEN }}
          filename: metrics/11-crypto.svg
          config_timezone: ${{ env.TZ }}
          base: ""
          plugin_crypto: yes
          plugin_crypto_id: bitcoin, ethereum, solana
          plugin_crypto_vs_currency: usd
          plugin_crypto_days: 30

      - name: 12 skyline — 贡献记录渲染成 3D 城市（Metaverse）
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.TOKEN }}
          filename: metrics/12-skyline.svg
          config_timezone: ${{ env.TZ }}
          base: ""
          plugin_skyline: yes
          plugin_skyline_year: 2025
          plugin_skyline_frames: 60
          plugin_skyline_quality: 0.5

      - name: 13 fortune — 随机箴言
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.TOKEN }}
          filename: metrics/13-fortune.svg
          config_timezone: ${{ env.TZ }}
          base: ""
          plugin_fortune: yes

      # ───────────────────── 仓库 / 社交数据 ─────────────────────

      - name: 14 repositories — 精选仓库
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.TOKEN }}
          filename: metrics/14-repositories.svg
          config_timezone: ${{ env.TZ }}
          base: ""
          plugin_repositories: yes
          plugin_repositories_pinned: 2

      - name: 15 notable — 重要贡献
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.TOKEN }}
          filename: metrics/15-notable.svg
          config_timezone: ${{ env.TZ }}
          base: ""
          plugin_notable: yes
          plugin_notable_repositories: yes

      - name: 16 lines — 代码增删行数
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.TOKEN }}
          filename: metrics/16-lines.svg
          config_timezone: ${{ env.TZ }}
          base: ""
          plugin_lines: yes

      - name: 17 people — 关注者 / 正在关注
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.TOKEN }}
          filename: metrics/17-people.svg
          config_timezone: ${{ env.TZ }}
          base: ""
          plugin_people: yes
          plugin_people_types: followers, following
          plugin_people_limit: 24

      - name: 18 stargazers — star 增长曲线
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.TOKEN }}
          filename: metrics/18-stargazers.svg
          config_timezone: ${{ env.TZ }}
          base: ""
          plugin_stargazers: yes
          plugin_stargazers_charts: yes

      # ─────────── 以下需要你填自己的账号信息，填好后取消注释 ───────────

      # - name: 19 anilist — 追番 / 追漫列表（Anime）
